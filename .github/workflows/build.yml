name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Installa Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa Java (Necessario per Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installa Flet e Dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install flet cryptography

    - name: Compila l'APK per Android
      run: |
        flet build apk

    - name: Salva l'APK come file scaricabile
      uses: actions/upload-artifact@v4
      with:
        name: app-android
        path: build/apk/*.apk
